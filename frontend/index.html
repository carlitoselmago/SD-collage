<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
     <link rel="icon" type="image/png"  href="{{ url_for('static',filename='favicon.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>SD-Collage</title>
     <meta name="description" content="Collaborative inpainting using AI image generation">
     <meta property="og:image" content="{{ url_for('static',filename='ogimage.jpg') }}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap');
        </style>
    <link href="{{ url_for('static',filename='main.css') }}" rel="stylesheet" type="text/css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NM5S1J45ZM"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-NM5S1J45ZM');
    </script>
</head>

<body class="{{ defaults.mode }} {{ defaults.ssl }}" width="{{ defaults.width }}" height="{{ defaults.height }}" firstimagewait="{{defaults.firstimagewait}}"">
    <div id="killer"><h1>Text here</h1></div>
    <div id="wrap">
        <div id="sid"></div>
            <div id="me"></div>
        <div id="main">
            <div id="loading"><h1>Loading canvas data<br><div id="loadcount"></div></h1></div>
            <div id="prompter" class="box">
                <div class="info maininfo ">Drag me</div>
                <div class="info busyinfo">Generating...</div>
            </div>

            <div id="others">

            </div>
            <div id="canvas"></div>
        </div>
    </div>


    <div id="inputs">
        <canvas id="minicanvas" ></canvas>
        <form id="promptform">
            <input id="prompt" placeholder="Prompt me" autocomplete="off">
            <button id="sendprompt">Send</button>
        </form>

    </div>
    {% if defaults.mode|trim == "streamer" %}
        <a id="initstreamer" href="">START</a>
    {% endif %}
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="//cdn.socket.io/4.4.1/socket.io.min.js"></script>

    <script src="{{ url_for('static',filename='canvassize.js') }}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/css/iziToast.min.css" integrity="sha512-O03ntXoVqaGUTAeAmvQ2YSzkCvclZEcPQu1eqloPaHfJ5RuNGiS4l+3duaidD801P50J28EHyonCV06CUlTSag==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/js/iziToast.min.js" integrity="sha512-Zq9o+E00xhhR/7vJ49mxFNJ0KQw1E1TMWkPTxrWcnpfEFDEXgUiwJHIKit93EW/XxE31HSI5GEOW06G6BF1AtA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="text/javascript" src="{{ url_for('static',filename='draggable_jquery.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static',filename='panzoom_jquery.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static',filename='streamer_jquery.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static',filename='main.js') }}"></script>
</body>

</html>
